<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AsistenteIA-VM</title>
<style>
  :root {
    --bg: #f4f6f8; --fg: #202124; --muted: #5f6368;
    --card: #ffffff; --border: #e0e3e7;
    --user: #e8f0fe; --assistant: #f1f3f4;
    --accent: #1a73e8; --code-bg: #f6f8fa;
    --shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  [data-theme="dark"] {
    --bg: #1a1b1e; --fg: #e6e6e6; --muted: #9aa0a6;
    --card: #25272b; --border: #3a3d42;
    --user: #1e3a5f; --assistant: #2d2f33;
    --accent: #4d90fe; --code-bg: #1e2024;
    --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 900px; margin: 0 auto; padding: 24px;
    background: var(--bg); color: var(--fg);
    transition: background .2s, color .2s;
  }
  header { display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { margin: 0 0 4px 0; font-size: 1.5rem; }
  .sub { color: var(--muted); font-size: .9rem; margin-bottom: 12px; }
  .toolbar { display: flex; gap: 8px; }
  .icon-btn {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
    color: var(--fg); font-size: .85rem;
  }
  .icon-btn:hover { background: var(--border); }

  #chat {
    height: 520px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin: 12px 0;
    box-shadow: var(--shadow);
  }
  .msg { padding: 12px 15px; margin: 10px 0; border-radius: 10px;
         line-height: 1.55; position: relative; animation: fade .2s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .user { background: var(--user); margin-left: 8%; }
  .assistant { background: var(--assistant); margin-right: 8%; }
  .msg pre { background: var(--code-bg); padding: 10px; border-radius: 6px;
             overflow-x: auto; font-size: .88rem; margin: 8px 0; }
  .msg code { font-family: "SF Mono", Consolas, monospace; font-size: .88rem; }
  .msg p { margin: 6px 0; }
  .msg ul, .msg ol { padding-left: 22px; margin: 6px 0; }
  .copy-btn {
    position: absolute; top: 6px; right: 6px;
    background: transparent; border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 8px; font-size: .75rem;
    cursor: pointer; color: var(--muted); opacity: 0; transition: opacity .2s;
  }
  .msg:hover .copy-btn { opacity: 1; }
  .copy-btn:hover { background: var(--border); }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted); animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }

  .status { font-size: .85rem; color: var(--muted); margin: 6px 0; min-height: 1.2em; }

  form { display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 70px; max-height: 200px;
    padding: 12px; border: 1px solid var(--border); border-radius: 10px;
    font: inherit; background: var(--card); color: var(--fg);
    transition: border-color .15s;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  button#send {
    padding: 0 22px; height: 70px; border: 0; border-radius: 10px;
    background: var(--accent); color: white; font-weight: bold;
    cursor: pointer; transition: opacity .15s;
  }
  button#send:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: .75rem; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>🤖 AsistenteIA-VM</h1>
    <div class="sub">Asistente local · Ubuntu + Ollama + llama3.2:1b</div>
  </div>
  <div class="toolbar">
    <button class="icon-btn" id="themeBtn" title="Cambiar tema">🌓</button>
    <button class="icon-btn" id="clearBtn" title="Limpiar chat">🗑️ Limpiar</button>
  </div>
</header>

<div id="chat" aria-live="polite"></div>
<div class="status" id="status">Listo.</div>

<form id="form">
  <textarea id="prompt" placeholder="Ejemplo: ¿Qué información puedo obtener con free -h?"
            aria-label="Escribe tu pregunta"></textarea>
  <button id="send" type="submit">Enviar</button>
</form>
<div class="hint">💡 <b>Enter</b> envía · <b>Shift+Enter</b> salto de línea</div>

<script>
(() => {
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const promptBox = document.getElementById("prompt");
  const statusBox = document.getElementById("status");
  const sendBtn = document.getElementById("send");
  const clearBtn = document.getElementById("clearBtn");
  const themeBtn = document.getElementById("themeBtn");

  // --- Estado persistente ---
  const STORAGE_KEY = "asistenteia-vm:messages";
  const THEME_KEY = "asistenteia-vm:theme";
  let messages = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
  let abortController = null;

  // --- Tema ---
  const savedTheme = localStorage.getItem(THEME_KEY) || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  themeBtn.addEventListener("click", () => {
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    localStorage.setItem(THEME_KEY, next);
  });

  // --- Markdown mínimo y seguro ---
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }
  function renderMarkdown(text) {
    let html = escapeHtml(text);
    // Bloques de código ```lang\n...\n```
    html = html.replace(/```(\w+)?\n([\s\S]*?)```/g,
      (_, lang, code) => `<pre><code>${code.trim()}</code></pre>`);
    // Código inline `...`
    html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
    // Negrita **...**
    html = html.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    // Cursiva *...*
    html = html.replace(/(^|\s)\*([^*\n]+)\*/g, "$1<i>$2</i>");
    // Listas
    html = html.replace(/(^|\n)- (.+)/g, "$1<li>$2</li>");
    html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
    // Párrafos
    html = html.split(/\n{2,}/).map(p =>
      p.startsWith("<pre>") || p.startsWith("<ul>") ? p : `<p>${p.replace(/\n/g,"<br>")}</p>`
    ).join("");
    return html;
  }

  // --- Renderizado ---
  function addMessage(role, content, { streaming = false } = {}) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    if (role === "assistant") {
      div.innerHTML = renderMarkdown(content);
      const copy = document.createElement("button");
      copy.className = "copy-btn";
      copy.textContent = "📋 Copiar";
      copy.onclick = () => {
        navigator.clipboard.writeText(content);
        copy.textContent = "✓ Copiado";
        setTimeout(() => copy.textContent = "📋 Copiar", 1500);
      };
      div.appendChild(copy);
    } else {
      div.textContent = content;
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement("div");
    div.className = "msg assistant";
    div.id = "typing-indicator";
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideTyping() {
    document.getElementById("typing-indicator")?.remove();
  }

  // --- Render inicial ---
  messages.forEach(m => addMessage(m.role, m.content));

  // --- Envío ---
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const text = promptBox.value.trim();
    if (!text || sendBtn.disabled) return;

    messages.push({ role: "user", content: text });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    addMessage("user", text);
    promptBox.value = "";
    autoResize();

    sendBtn.disabled = true;
    sendBtn.textContent = "Enviando…";
    statusBox.textContent = "Consultando Ollama…";
    showTyping();

    abortController = new AbortController();
    const timeout = setTimeout(() => abortController.abort(), 120_000); // 2 min

    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages, stream: true }),
        signal: abortController.signal
      });

      hideTyping();

      // Intentamos streaming (NDJSON de Ollama)
      if (response.headers.get("content-type")?.includes("application/x-ndjson") ||
          response.headers.get("content-type")?.includes("text/event-stream")) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let full = "";
        const assistantDiv = addMessage("assistant", "", { streaming: true });

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const data = JSON.parse(line);
              if (data.message?.content) {
                full += data.message.content;
                assistantDiv.firstChild && assistantDiv.firstChild.nodeType === 3
                  ? (assistantDiv.childNodes[0].nodeValue = "")
                  : null;
                // Re-render con markdown (simple pero efectivo)
                const copyBtn = assistantDiv.querySelector(".copy-btn");
                assistantDiv.innerHTML = renderMarkdown(full);
                if (copyBtn) assistantDiv.appendChild(copyBtn);
                else {
                  const b = document.createElement("button");
                  b.className = "copy-btn"; b.textContent = "📋 Copiar";
                  b.onclick = () => navigator.clipboard.writeText(full);
                  assistantDiv.appendChild(b);
                }
                chat.scrollTop = chat.scrollHeight;
              }
              if (data.eval_count) {
                statusBox.textContent =
                  `Modelo: ${data.model || "asistenteia-vm"} · Tokens: ${data.eval_count}`;
              }
            } catch (_) { /* línea incompleta */ }
          }
        }
        messages.push({ role: "assistant", content: full });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
      } else {
        // Fallback: respuesta JSON completa
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Error del servidor");
        const answer = data.message.content;
        messages.push({ role: "assistant", content: answer });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
        addMessage("assistant", answer);
        statusBox.textContent = data.eval_count
          ? `Modelo: ${data.model || "asistenteia-vm"} · Tokens: ${data.eval_count}`
          : "Respuesta recibida.";
      }
    } catch (err) {
      hideTyping();
      if (err.name === "AbortError") {
        addMessage("assistant", "⏱️ La respuesta tardó demasiado. Revisa que Ollama esté activo.");
        statusBox.textContent = "Timeout.";
      } else {
        addMessage("assistant", "❌ Error: " + err.message);
        statusBox.textContent = "Revisa que Ollama y el servidor estén ejecutándose.";
      }
    } finally {
      clearTimeout(timeout);
      sendBtn.disabled = false;
      sendBtn.textContent = "Enviar";
      promptBox.focus();
    }
  });

  // --- Atajos y auto-resize ---
  promptBox.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });
  function autoResize() {
    promptBox.style.height = "auto";
    promptBox.style.height = Math.min(promptBox.scrollHeight, 200) + "px";
  }
  promptBox.addEventListener("input", autoResize);

  // --- Limpiar chat ---
  clearBtn.addEventListener("click", () => {
    if (!messages.length || confirm("¿Borrar todo el historial?")) {
      messages = [];
      localStorage.removeItem(STORAGE_KEY);
      chat.innerHTML = "";
      statusBox.textContent = "Chat limpio.";
    }
  });
})();
</script>
</body>
</html>
